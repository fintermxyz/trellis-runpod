name: image

# Builds the generation server image and publishes it to
# ghcr.io/fintermxyz/trellis-runpod (:latest and :<commit sha>).
on:
  push:
    branches: [main]
    paths: [Dockerfile, install_deps.sh, install_deps_hunyuan.sh, server.py, .github/workflows/image.yml]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      # The CUDA devel base + compiled extensions need ~30 GB; a stock runner has ~14 GB free.
      - uses: jlumbroso/free-disk-space@v1.3.1
        with:
          tool-cache: true
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: true
          swap-storage: true
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          provenance: false
          tags: |
            ghcr.io/fintermxyz/trellis-runpod:latest
            ghcr.io/fintermxyz/trellis-runpod:${{ github.sha }}
