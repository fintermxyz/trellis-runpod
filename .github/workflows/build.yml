name: build
on:
  push:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      # The image is ~15 GB uncompressed; the stock runner only has ~14 GB free.
      - name: Free disk space
        run: |
          sudo rm -rf /usr/local/lib/android /opt/hostedtoolcache /usr/share/dotnet /opt/ghc /usr/local/share/boost "$AGENT_TOOLSDIRECTORY" || true
          sudo docker image prune -af || true
          df -h /
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/fintermxyz/trellis-runpod:latest
            ghcr.io/fintermxyz/trellis-runpod:${{ github.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/fintermxyz/trellis-runpod
            org.opencontainers.image.description=Microsoft TRELLIS text-to-3D generation server for RunPod pods
