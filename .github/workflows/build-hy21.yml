name: build-hy21

# Builds the production image (Dockerfile) with the Hunyuan3D-2.1 shape model added, for A/B tests on a
# test pod, and publishes it ONLY as ghcr.io/fintermxyz/trellis-runpod:h21-<commit sha> and :h21-latest.
# Never :latest or a bare :<sha>, which the production pods / image.yml use.
on:
  push:
    branches: [hy21]
    paths: [Dockerfile, install_deps.sh, install_deps_hunyuan.sh, install_deps_hy21.sh, check_hy21.py, server.py, .github/workflows/build-hy21.yml]
  workflow_dispatch: {}

permissions:
  contents: read
  packages: write

concurrency:
  group: build-hy21
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      # The CUDA devel base + torch + compiled extensions need ~30 GB; a stock runner has ~14 GB free.
      - uses: jlumbroso/free-disk-space@v1.3.1
        with:
          tool-cache: true
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: true
          swap-storage: true
      - name: Free more disk space
        run: |
          sudo rm -rf /usr/local/lib/android /opt/hostedtoolcache /usr/share/dotnet /opt/ghc /usr/local/share/boost "$AGENT_TOOLSDIRECTORY" || true
          df -h /
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          push: true
          provenance: false
          tags: |
            ghcr.io/fintermxyz/trellis-runpod:h21-${{ github.sha }}
            ghcr.io/fintermxyz/trellis-runpod:h21-latest
          labels: |
            org.opencontainers.image.source=https://github.com/fintermxyz/trellis-runpod
            org.opencontainers.image.description=Hunyuan3D-2.0 generation server + Hunyuan3D-2.1 shape model (A/B test build)
      - name: Disk after build
        if: always()
        run: df -h /
